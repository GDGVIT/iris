name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # Same uv as the Dockerfile, so CI resolves what production builds
          version: "0.10.11"
          enable-cache: true

      - name: Install
        run: uv sync --locked --dev

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Script syntax
        run: node --check static/script.js

      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=95

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --tag iris:ci .
