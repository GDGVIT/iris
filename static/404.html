<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page not found · Iris</title>
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#0d1117" />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
        <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        />
        <link rel="stylesheet" href="/static/styles.css" />
    </head>

    <body>
        <div class="shell">
            <header class="masthead">
                <a class="wordmark" href="/" aria-label="Iris home">
                    <img src="/static/logo.svg" alt="" width="24" height="24" />
                    <span>Iris</span>
                </a>
                <nav class="masthead-links" aria-label="Project">
                    <a href="/api/docs" target="_blank" rel="noopener">API</a>
                    <a href="https://github.com/mdhishaamakhtar/iris" target="_blank" rel="noopener">Source</a>
                </nav>
            </header>

            <main>
                <section class="lead" aria-labelledby="lostTitle">
                    <p class="lost-code">404</p>
                    <h1 id="lostTitle">No page here.</h1>
                    <p class="lead-copy">
                        Nothing links to this address. Iris is a single page,
                        and Wikipedia has the other seven million.
                    </p>
                    <div class="route-actions">
                        <a class="btn btn-primary" href="/">Find a path</a>
                    </div>
                </section>
            </main>

            <footer class="colophon">
                <p>Searches live English Wikipedia.</p>
                <p>
                    <a href="https://github.com/mdhishaamakhtar/iris" target="_blank" rel="noopener">Open source, GPL-3.0</a>
                </p>
            </footer>
        </div>
    </body>
</html>
