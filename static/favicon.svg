    <line x1="8" y1="8" x2="16" y2="24" />
    <line x1="24" y1="8" x2="16" y2="24" />
  </g>
  <circle cx="8" cy="8" r="4" fill="#3fb950" />
  <circle cx="24" cy="8" r="4" fill="#f85149" />
  <circle cx="16" cy="24" r="4" fill="#58a6ff" />
</svg>
